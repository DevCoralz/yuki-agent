# fly.toml app configuration file generated for yuki-agent on 2026-09-10T07:38:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'yuki-agent'
primary_region = 'lhr'

[build]

[env]
  ADMIN_SESSIONS = 'coralz,yuki'
  SESSION_DATA_PATH = '/data/whatsapp-auth'
  YUKI_API_BASE_URL = 'http://yuki-model-server.internal:8000'
  YUKI_HISTORY_MESSAGES = '12'
  YUKI_MAX_FILE_BYTES = '512000'
  YUKI_MAX_TOOL_ROUNDS = '12'
  YUKI_WORKSPACE_ROOT = '/data/sessions'

[processes]
  app = 'node src/app.js'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '32gb'
  cpu_kind = 'performance'
  cpus = 4
  memory_mb = 32768
